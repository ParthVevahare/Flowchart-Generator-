P.fns.forEach((f,i)=>{const re=new RegExp('\\b('+names.join('|')+')\\s*\\(');walk(f.body,s=>{if(s.k=='in')cnt.in++;if(s.k=='out')cnt.out++;if(s.k=='if'||s.k=='sw')cnt.dec++;if(/^(while|for|do)$/.test(s.k))cnt.loop++;if(s.k=='ret')cnt.ret++;if(s.k=='p'&&re.test(s.t))cnt.call++})});
$('chips').innerHTML=[`Language: ${LN2[LG]}${lg=='auto'?' (auto-detected)':''}`,`Entry: ${P.fns[0].disp||P.fns[0].name+'()'}`,`Functions: ${P.fns.length}`,`Variables: ${P.vars.size}${P.vars.size?' ('+[...P.vars].slice(0,6).join(', ')+(P.vars.size>6?'…':'')+')':''}`,`Inputs: ${cnt.in}`,`Outputs: ${cnt.out}`,`Conditions: ${cnt.dec}`,`Loops: ${cnt.loop}`,`Calls: ${cnt.call}`,`Returns: ${cnt.ret}`].map(t=>`<span class="chip">${esc(t)}</span>`).join('');
try{$('psb').textContent=pseudo(P)}catch(e){$('psb').textContent='// Pseudocode could not be generated for this code.'}show(0)}catch(e){showErr(e,lg=='auto'?LG:null)}$('ld').hidden=true},450)}
$('go').onclick=gen;
$('rs').onclick=()=>{ta.value='';gut();charts=[];stage.innerHTML='<div class="empty">Your flowchart will appear here</div>';$('tabs').innerHTML='';$('chips').innerHTML='';$('err').style.display='none';$('exb').innerHTML='';$('psb').textContent=''};
$('exs').onchange=e=>{if(e.target.value!==''){ta.value=EX[e.target.value];$('lang').value='auto';gut();gen();e.target.value=''}};
$('zi').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25)};
$('zo').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,.8)};$('fit').onclick=fit;
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('pane').requestFullscreen&&$('pane').requestFullscreen();
document.addEventListener('fullscreenchange',()=>setTimeout(fit,100));window.addEventListener('resize',fit);
function pnl(id,btn){const e=$(id),o=e.style.display=='block';['exp','ps'].forEach(x=>$(x).style.display='none');['xp','pcb'].forEach(x=>$(x).classList.remove('on'));if(!o){e.style.display='block';$(btn).classList.add('on')}setTimeout(fit,50)}
$('xp').onclick=()=>pnl('exp','xp');$('pcb').onclick=()=>pnl('ps','pcb');
function cpt(t,msg){const ok=()=>toast(msg);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(ok,()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')?ok():toast('Copy not permitted here')}catch(e){toast('Copy not permitted here')}a.remove()})}
$('cpp').onclick=()=>{const t=$('psb').textContent;if(!t)return toast('Generate a flowchart first');cpt(t,'Pseudocode copied')};
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:.89)},{passive:false});
const pts=new Map();
stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY])};
stage.onpointermove=e=>{const o=pts.get(e.pointerId);if(!o)return;
if(pts.size==1){V.x+=e.clientX-o[0];V.y+=e.clientY-o[1];apply()}
else if(pts.size==2){const ot=[...pts].find(([id])=>id!=e.pointerId)[1],d0=Math.hypot(o[0]-ot[0],o[1]-ot[1]),d1=Math.hypot(e.clientX-ot[0],e.clientY-ot[1]);zoomAt((e.clientX+ot[0])/2,(e.clientY+ot[1])/2,d1/d0)}
pts.set(e.pointerId,[e.clientX,e.clientY])};
stage.onpointerup=stage.onpointercancel=e=>pts.delete(e.pointerId);
/* ---------- export ---------- */
function svgStr(sc){const c=charts[cur];return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${c.W} ${c.H}" width="${c.W*sc}" height="${c.H*sc}" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><rect width="${c.W}" height="${c.H}" fill="#ffffff"/>${c.inner}</svg>`}
function canvas(cb){if(!charts[cur])return toast('Generate a flowchart first');const sc=2,im=new Image();
im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);cb(c)};im.onerror=()=>toast('Export failed');im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr(sc))}
let DLC=null;try{window.claude&&claude.use('downloads').then(d=>DLC=d,()=>{})}catch(e){}
async function dl(data,name){if(DLC){try{await DLC.save({filename:name,data});toast('Saved '+name)}catch(e){if(e.code!='declined')toast('Download failed: '+(e.message||e.code))}return}
const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=name;a.click()}
const fn=()=>(charts[cur]?charts[cur].fname:'flowchart')+'-flowchart';
$('ePng').onclick=()=>canvas(c=>c.toBlob(b=>dl(b,fn()+'.png'),'image/png'));
$('eSvg').onclick=()=>{if(!charts[cur])return toast('Generate a flowchart first');dl(new Blob([svgStr(1)],{type:'image/svg+xml'}),fn()+'.svg')};
$('ePdf').onclick=()=>canvas(c=>{if(!window.jspdf)return toast('PDF library failed to load');const L=c.width>c.height,p=new jspdf.jsPDF({orientation:L?'l':'p',unit:'mm',format:'a4'});p.addImage(c.toDataURL('image/png'),'PNG',0,0,L?297:210,L?210:297);dl(p.output('blob'),fn()+'.pdf')});
const copyTxt=()=>navigator.clipboard.writeText(svgStr(1)).then(()=>toast('Image copy unavailable — SVG code copied'),()=>toast('Copy not permitted here'));
$('cp').onclick=()=>canvas(c=>c.toBlob(b=>{try{navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(()=>toast('Flowchart copied'),copyTxt)}catch(e){copyTxt()}}));
$('sh').onclick=()=>canvas(c=>c.toBlob(b=>{const f=new File([b],fn()+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Flowchart'}).catch(()=>{});else $('cp').click()}));
function setTh(d){document.documentElement.dataset.theme=d?'dark':'light';$('th').textContent=d?'☀ Light':'🌙 Dark';try{localStorage.setItem('th',d?'d':'l')}catch(e){}}
let sv=null;try{sv=localStorage.getItem('th')}catch(e){}setTh(sv=='d');
$('th').onclick=()=>setTh(document.documentElement.dataset.theme!='dark');
$('cpa').onclick=()=>{const c=charts[cur];if(!c)return toast('Generate a flowchart first');if(!c.algText)return toast('Algorithm unavailable for this syntax');cpt(c.algText,'Algorithm copied')};
if(/^G-[A-Z0-9]+$/.test(SITE.ga)){const gs=document.createElement('script');gs.async=1;gs.src='https://www.googletagmanager.com/gtag/js?id='+SITE.ga;document.head.appendChild(gs);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config',SITE.ga)}
if(SITE.ns){let seen=null;try{seen=sessionStorage.getItem('vc')}catch(e){}
fetch(`https://abacus.jasoncameron.dev/${seen?'get':'hit'}/${encodeURIComponent(SITE.ns)}/${encodeURIComponent(SITE.key)}`).then(r=>r.json()).then(d=>{if(d&&d.value!=null){$('vc').hidden=false;$('vc').textContent='📈 '+Number(d.value).toLocaleString()+' visits';try{sessionStorage.setItem('vc','1')}catch(e){}}}).catch(()=>{})}
const mn=$('mn');$('exm').onclick=e=>{e.stopPropagation();mn.classList.toggle('open')};mn.onclick=()=>mn.classList.remove('open');
document.addEventListener('click',()=>mn.classList.remove('open'));document.addEventListener('keydown',e=>{if(e.key=='Escape')mn.classList.remove('open')});
ta.value=EX[0];gut();gen();
</script></body></html>
