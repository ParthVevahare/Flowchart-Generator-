/* ---------- parser ---------- */
function lex(src){const T=[],re=/\/\/[^\n]*|\/\*[\s\S]*?\*\/|^[ \t]*#[^\n]*|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|\d[\w.]*|[A-Za-z_]\w*|<<=|>>=|<<|>>|\+\+|--|->|::|[=!<>+\-*\/%&|^]=|&&|\|\||\S|\n/gm;let line=1,m;
while(m=re.exec(src)){const t=m[0];if(t=='\n'){line++;continue}if(/^\s*(\/[\/*]|#)/.test(t)){line+=(t.match(/\n/g)||[]).length;continue}T.push({t,l:line})}return T}
function isUn(a,k){const t=a[k].t;if(!/^(\+|-|\+\+|--)$/.test(t))return false;if(!k)return true;const p=a[k-1].t;return!(/^[\w"')\]]/.test(p)&&!/^(return|case|else|do)$/.test(p))}
const jt=a=>a.reduce((o,x,i)=>o+(i&&!isUn(a,i-1)?' ':'')+x.t,'');
const fm=a=>jt(a).replace(/\s+([,;)\]])/g,'$1').replace(/([(\[!])\s+/g,'$1').replace(/\s*(::|->|\+\+|--|\.)\s*/g,(m,o)=>o).replace(/\b(?!return\b)(\w+)\s+\(/g,'$1(').replace(/\s+/g,' ').trim();
const split=(a,s)=>{const r=[[]];let d=0;a.forEach(x=>{if('([{'.includes(x.t)&&x.t.length==1)d++;if(')]}'.includes(x.t)&&x.t.length==1)d--;if(x.t==s&&!d)r.push([]);else r[r.length-1].push(x)});return r};
function parse(src){const T=lex(src);let i=0;const vars=new Set();
const err=(m,l)=>{throw{m,l:l||(T[Math.min(i,T.length-1)]||{l:1}).l}};
const st=[];for(const k of T){if(k.t.length>1)continue;if('({['.includes(k.t))st.push(k);else if(')}]'.includes(k.t)){const o=st.pop();if(!o||'({['.indexOf(o.t)!=')}]'.indexOf(k.t))err(`Unmatched '${k.t}'`+(o?` (the last open bracket was '${o.t}' on line ${o.l})`:''),k.l)}}
if(st.length)err(`'${st[st.length-1].t}' is never closed`,st[st.length-1].l);
const is=t=>T[i]&&T[i].t==t;
const eat=t=>{if(!is(t))err(`Expected '${t}'`+(T[i]?` but found '${T[i].t}'`:' but reached the end of the code'),t==';'?T[i-1].l:(T[i]||T[i-1]).l);i++};
const paren=()=>{eat('(');const a=[];let d=0;while(i<T.length){const t=T[i].t;if(t=='(')d++;if(t==')'){if(!d)break;d--}a.push(T[i++])}eat(')');return a};
function semi(){const a=[];let d=0;while(i<T.length){const t=T[i].t;if(t.length==1&&'({['.includes(t))d++;else if(t.length==1&&')}]'.includes(t))d--;
if(d<0)err(`Missing ';' before '${t}'`,T[i-1].l);if(t==';'&&!d)break;const p=a[a.length-1];
if(p&&/^[\w"')\]]/.test(p.t)&&/^[\w"']/.test(t)&&T[i].l>p.l&&!d)err(`Missing ';' at the end of line ${p.l}`,p.l);a.push(T[i++])}
if(i>=T.length)err("Missing ';' at end of statement",T[T.length-1].l);i++;return a}
function seq(){const r=[];while(!is('}')){if(i>=T.length)err("Missing '}'");r.push(...stmt())}i++;return r}
const TP=/^((const|static|unsigned|signed|register|extern)\s+)*(int|float|double|char|long|short|bool|string|auto|size_t|vector\S*|struct \w+)\b/;
function simple(){const a=semi(),f=fm(a),s=a.map(x=>x.t),has=n=>s.includes(n),l=a[0]?a[0].l:0;let k='p',t=f;
if(['scanf','scanf_s','cin','gets','getline','getchar','fgets'].some(has)){k='in';t='Input: '+f;
if(has('scanf')||has('scanf_s')){const j=a.findIndex(x=>x.t[0]=='"');t='Input: '+split(a.slice(j+2,-1),',').map(x=>fm(x).replace(/^&/,'')).join(', ')}
else if(has('cin')&&s[s.indexOf('cin')+1]=='>>')t='Input: '+split(a.slice(s.indexOf('cin')+1),'>>').map(fm).filter(Boolean).join(', ')}
else if(['printf','puts','putchar','cout','cerr','fprintf'].some(has)){k='out';t='Output: '+f;
const pi=s.findIndex(x=>/^(printf|puts|putchar)$/.test(x));
if(pi>=0)t='Output: '+fm(a.slice(pi+2,-1));
else if(has('cout')||has('cerr'))t='Output: '+split(a.slice(s.findIndex(x=>/^c(out|err)$/.test(x))+1),'<<').map(fm).filter(Boolean).join(', ')}
else if(TP.test(f)){const rest=f.replace(TP,'');split(a.slice(a.findIndex((x,j)=>j>0&&/^[*&A-Za-z_]/.test(x.t)&&!/^(int|float|double|char|long|short|const|unsigned|signed|static|bool|string|auto|size_t|struct)$/.test(x.t))),',').forEach(p=>{const m=fm(p).match(/^[*&\s]*([A-Za-z_]\w*)/);if(m)vars.add(m[1])});
if(!f.includes('=')&&!f.includes('('))t='Declare '+f}
return{k,t,l,q:a}}
function stmt(){const q=T[i];if(!q)err('Unexpected end of code');const t=q.t,l=q.l;
if(t=='{'){i++;return seq()}if(t==';'){i++;return[]}
if(t=='if'){i++;const ct=paren(),c=fm(ct),y=stmt();let e=null;if(is('else')){i++;e=stmt();if(!e.length)e=null}return[{k:'if',c,ct,y,e,l}]}
if(t=='else')err("'else' without a matching 'if'");
if(t=='while'){i++;const ct=paren(),c=fm(ct);return[{k:'while',c,ct,b:stmt(),l}]}
if(t=='do'){i++;const b=stmt();eat('while');const ct=paren(),c=fm(ct);eat(';');return[{k:'do',c,ct,b,l}]}
if(t=='for'){i++;const h=paren(),p=split(h,';');let init=null,c,step=null,pre=[],it=null,ct=null,stt=null,rf=null;
if(p.length==3){init=fm(p[0])||null;c=fm(p[1])||'true';step=fm(p[2])||null;it=p[0];ct=p[1];stt=p[2]}
else{const q2=split(h,':');if(q2.length<2)err("Invalid 'for' header",l);c='Items left in '+fm(q2[1])+'?';rf=[fm(q2[0]),fm(q2[1])];pre=[{k:'p',t:fm(q2[0])+' = next item of '+fm(q2[1]),l}]}
return[{k:'for',i:init,c,it,ct,stt,rf,s:step,b:pre.concat(stmt()),l}]}
if(t=='switch'){i++;const ct=paren(),c=fm(ct);eat('{');const cs=[];let cur=null;
while(!is('}')){if(i>=T.length)err("Missing '}' for switch",l);const w=T[i];
if(w.t=='case'||w.t=='default'){i++;let lab='default';if(w.t=='case'){const a=[];while(!is(':')){if(i>=T.length||is('}'))err("Expected ':' after case label",w.l);a.push(T[i++])}lab=fm(a)}eat(':');
if(cur&&!cur.b.length){cur.lab+=', '+lab;if(w.t=='default')cur.d=1}else{cur={lab:w.t=='case'?'case '+lab:'default',d:w.t=='default',b:[]};cs.push(cur)}}
else{if(!cur)err('Statement before the first case label',w.l);cur.b.push(...stmt())}}
i++;return[{k:'sw',c,ct,cs,l}]}
if(t=='return'){i++;const a=semi();return[{k:'ret',t:'return'+(a.length?' '+fm(a):''),q:a,l}]}
if(t=='break'||t=='continue'){i++;eat(';');return[{k:t=='break'?'brk':'cnt',l}]}
if(t=='goto')err('goto is not supported — it cannot be drawn as structured control flow');
if(t=='case'||t=='default')err(`'${t}' outside of a switch`);
return[simple()]}
const fns=[],glob=[],globq=[];
while(i<T.length){if(is('}')){i++;continue}const h=[];let d=0,eq=false;
while(i<T.length&&!(d==0&&(T[i].t==';'||(T[i].t=='{'&&!eq)))){if(T[i].t=='='&&d==0)eq=true;if(T[i].t=='(')d++;if(T[i].t==')')d--;h.push(T[i++])}
if(i>=T.length){if(h.length)err("Missing ';' at end of declaration",h[h.length-1].l);break}
const ht=h.map(x=>x.t);
if(T[i].t=='{'){const p=ht.indexOf('(');
if(p>0&&!/^(struct|class|enum|union|namespace)$/.test(ht[0])){i++;fns.push({name:ht[p-1],rt:fm(h.slice(0,p-1)).replace(/\S*::$/,'').trim(),params:fm(h.slice(p+1,ht.lastIndexOf(')'))),body:seq(),l:h[0].l})}
else if(ht[0]=='namespace')i++;
else{let dd=0;do{if(T[i].t=='{')dd++;if(T[i].t=='}')dd--;i++}while(dd&&i<T.length)}}
else{i++;if(h.length&&!(ht.includes('(')&&!ht.includes('='))&&!/^(using|typedef)$/.test(ht[0])){glob.push(fm(h));globq.push(h)}}}
if(!fns.length)err("No function found. Wrap your code in a function such as 'int main() { ... }'.",1);
fns.sort((a,b)=>(b.name=='main')-(a.name=='main'));
return{fns,glob,vars,globq}}
/* ---------- layout ---------- */
const CW=7.6,LH=17,GAP=34;let N,E,BK,CN,RT;
function wrapT(t,n){const L=[];let c='';for(const w of t.split(' ')){if(c&&(c+' '+w).length>n){L.push(c);c=w}else c=c?c+' '+w:w}L.push(c);return L}
function bx(t,k){const d=k=='dec',io=k=='in'||k=='out',L=wrapT(t,d?14:26),m=Math.max(...L.map(l=>l.length))*CW,h=L.length*LH;
return d?{L,w:Math.max(130,m*1.5+36),h:Math.max(74,h+52)}:{L,w:Math.max(k=='term'?110:100,m+(io?72:44)),h:Math.max(k=='term'?40:38,h+24)}}
function mk(k,t,cx,y){const g=bx(t,k),n={k,L:g.L,w:g.w,h:g.h,x:cx-g.w/2,y,cx};N.push(n);return n}
function link(pe,tx,ty){pe.forEach(e=>{const p=e.pts.slice(),lx=p[p.length-1][0];if(lx!=tx)p.push([lx,ty-14],[tx,ty-14]);p.push([tx,ty]);E.push({pts:p,label:e.label,lp:e.lp,dash:e.dash})})}
const bad=(m,s)=>{throw{m,l:s.l}};
function measure(l){let a=0,b=0;l.forEach(s=>{const m=M[s.k](s);a=Math.max(a,m.l);b=Math.max(b,m.r)});return{l:a,r:b}}
function place(l,cx,y,pe,top){let first=null;for(let i=0;i<l.length;i++){if(!pe.length)break;const r=P[s=l[i],s.k](s,cx,y,pe,top&&i==l.length-1);first=first||r.first;y=r.y;pe=r.pend}return{y,pend:pe,first}}
var s;
const P={},M={};
function sim(k,t,cx,y,pe){const n=mk(k,t,cx,y);link(pe,cx,y);return{first:n,y:y+n.h+GAP,pend:[{pts:[[cx,y+n.h]]}]}}
['p','in','out','call'].forEach(k=>P[k]=(s,cx,y,pe)=>sim(s.k,s.t,cx,y,pe));
['p','in','out','call','ret'].forEach(k=>M[k]=s=>{const w=bx(s.t,s.k).w/2;return{l:w,r:w}});
['brk','cnt'].forEach(k=>M[k]=()=>{const w=bx('continue','p').w/2;return{l:w,r:w}});
