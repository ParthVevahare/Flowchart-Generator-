name: Generator and cloud library tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --only-shell chromium
      - name: Check Chromium runtime dependencies
        run: node -e "require('playwright').chromium.launch().then(browser => browser.close())" || npx playwright install-deps chromium
      - run: npm run build:parser && git diff --exit-code -- vendor/advanced.js
      - run: npm run check:guides
      - run: npm run check:assets
      - run: npm run check:sitemap
      - run: npm test
      - run: npm run test:ui
        env:
          PLAYWRIGHT_VERIFY_DOWNLOAD_FILE: '1'
      - run: npm run test:rules
